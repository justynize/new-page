                    <form>
                        <label for="">Name</label>
                        <input type="text" id="name" placeholder="Surname first" required>
                        <div class="error" id="nameError"></div>

                        <label for="">Number</label>
                        <input type="number" id="number" placeholder="Enter your phone no." required>

                        <input type="number" id="age" placeholder="How old are you" required>
                        <div class="error" id="ageError"></div>
        
        
        
                        <label for="">Email</label>
                        <input type="email" id="email" placeholder="Enter your email" required>
                        <div class="error" id="emailError"></div>
        
                        <label for="">Choose a password</label>
                        <input type="password" id="password" placeholder="Enter your password" required>
                        <div class="error" id="passwordError"></div>

                       
                        
                        <button type="submit" class="btn" id="submitBtn">Sign in</button>
                    </form>
